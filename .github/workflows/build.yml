name: Build addon

# 「Use this template」で複製したリポジトリでも、push するだけで
# 本体MOD「The four primitives and Weapons」の jar が自動でビルドされ、
# 続けて addon の jar まで生成される。
# 生成物は Actions の実行ページ → Artifacts からダウンロードできる。

on:
  push:
  pull_request:
  workflow_dispatch:

# 既定の GITHUB_TOKEN を最小権限に絞る（checkout と artifact アップロードのみ）
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout addon
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 本体MOD を GitHub から clone してビルドし、libs/local/ に jar を配置する
      - name: Build main mod jar (The four primitives and Weapons)
        run: bash scripts/fetch-maw-jar.sh --force

      - name: Build addon
        run: ./gradlew build --no-daemon -Dnet.minecraftforge.gradle.check.certs=false

      - name: Upload addon jar
        uses: actions/upload-artifact@v4
        with:
          name: maw-sample-addon
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
